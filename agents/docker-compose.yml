version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playbook-pulse-agents
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./app/data:/app/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - playbook-network

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: playbook-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - playbook-network

networks:
  playbook-network:
    driver: bridge

volumes:
  redis-data:
